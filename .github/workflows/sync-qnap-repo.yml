name: Sync QNAP Repository

"on":
  schedule:
    # UTC 19:30 ≈ Asia/Shanghai 03:30
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Emby only process this upstream version (empty means latest non-prerelease)
        required: false
        type: string
      allow_prerelease:
        description: Emby only allow upstream pre-release packages
        required: false
        type: boolean
        default: false
      skip_build:
        description: Skip package sync and only regenerate repo.xml
        required: false
        type: boolean
        default: false
      skip_emby:
        description: Skip Emby sync job
        required: false
        type: boolean
        default: false
      skip_tailscale:
        description: Skip Tailscale sync job
        required: false
        type: boolean
        default: false
      dry_run:
        description: Discover only without publishing releases or writing feeds
        required: false
        type: boolean
        default: false
      force_emby:
        description: Force rebuild and re-upload Emby release even if tag exists
        required: false
        type: boolean
        default: false
      force_tailscale:
        description: Force re-upload Tailscale release even if tag exists
        required: false
        type: boolean
        default: false
      accelerate_preset:
        description: Feed URL GitHub accelerate preset (none means use config.json)
        required: false
        type: string
        default: none

permissions:
  contents: write

concurrency:
  group: sync-qnap-repo
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  emby:
    name: Sync Emby
    if: ${{ inputs.skip_build != true && inputs.skip_emby != true }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.sync.outputs.released }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full openssl ca-certificates

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify Emby signing material
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          test -f signing/certificate.pem
          test -f signing/private_key.pem
          openssl version
          7z -h >/dev/null
          gh --version

      - name: Sync Emby packages
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ALLOW_PRERELEASE: ${{ inputs.allow_prerelease }}
          INPUT_FORCE: ${{ inputs.force_emby }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "released=false" >> "$GITHUB_OUTPUT"
          args=(emby --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}")
          if [ -n "${INPUT_VERSION:-}" ]; then
            args+=(--version "${INPUT_VERSION}")
          fi
          if [ "${INPUT_ALLOW_PRERELEASE:-false}" = "true" ]; then
            args+=(--allow-prerelease)
          fi
          if [ "${INPUT_FORCE:-false}" = "true" ]; then
            args+=(--force)
          fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 sync_release.py "${args[@]}"

      - name: Upload Emby signature fragment
        if: ${{ inputs.dry_run != true && steps.sync.outputs.released == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: signatures-emby
          path: out/signatures-emby.json
          if-no-files-found: warn

  tailscale:
    name: Sync Tailscale
    if: ${{ inputs.skip_build != true && inputs.skip_tailscale != true }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.sync.outputs.released }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl ca-certificates

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync Tailscale packages
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_FORCE: ${{ inputs.force_tailscale }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "released=false" >> "$GITHUB_OUTPUT"
          args=(tailscale --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}")
          if [ "${INPUT_FORCE:-false}" = "true" ]; then
            args+=(--force)
          fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 sync_release.py "${args[@]}"

      - name: Upload Tailscale signature fragment
        if: ${{ inputs.dry_run != true && steps.sync.outputs.released == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: signatures-tailscale
          path: out/signatures-tailscale.json
          if-no-files-found: warn

  feeds:
    name: Update repo feeds
    needs: [emby, tailscale]
    # Update when skip_build, or when any sync job actually published/refreshed a release.
    # Do not require both jobs to succeed: one release is enough.
    if: ${{ always() && !cancelled() && inputs.dry_run != true && (inputs.skip_build == true || needs.emby.outputs.released == 'true' || needs.tailscale.outputs.released == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update feeds
        uses: ./.github/actions/update-feeds
        with:
          accelerate_preset: ${{ inputs.accelerate_preset }}
